name: Bounded GPT review of a passive recon run

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed passive_recon.yml run ID containing the secured report'
        required: true
        type: string
      summary_run_id:
        description: 'Optional completed bounded-ai-review run ID for aggregate HTTP status diagnostics'
        required: false
        type: string
      live:
        description: 'Send explicitly scoped GET requests (default: offline plan only)'
        required: true
        default: false
        type: boolean
      auth:
        description: 'Model authentication for live review'
        required: true
        default: api-key
        type: choice
        options:
          - api-key
          - chatgpt
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      live:
        required: true
        type: boolean
      auth:
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: chatgpt-plus-session
  cancel-in-progress: false

jobs:
  review:
    if: inputs.auth != 'chatgpt' || !inputs.live || (github.ref == 'refs/heads/main' && github.actor == 'ohjun1998')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set runner session directory
        if: inputs.live && inputs.auth == 'chatgpt'
        run: echo "CHATGPT_CI_SESSION_DIR=$RUNNER_TEMP/passive-scan-chatgpt" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: passive-recon-master-report-secured
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source_report
      - name: Restore SQLite report and explicit target policy
        env:
          REPORT_PASSWORD: ${{ secrets.ACTIONS_CRYPTO_PASSWORD }}
          REVIEW_CONFIG: ${{ secrets.AI_REVIEW_CONFIG_JSON }}
        run: |
          test -n "$REPORT_PASSWORD"
          test -n "$REVIEW_CONFIG"
          umask 077
          python3 -c 'import os, pathlib; pathlib.Path("ai_review.config.json").write_text(os.environ["REVIEW_CONFIG"], encoding="utf-8")'
          mkdir -p source_report/decrypted
          unzip -q -P "$REPORT_PASSWORD" source_report/passive_recon_report_secured.zip recon_history.db -d source_report/decrypted
      - name: Install GPT dependency
        if: inputs.live
        run: python3 -m pip install openai cryptography
      - name: Restore protected ChatGPT session
        id: restore_session
        if: inputs.live && inputs.auth == 'chatgpt'
        env:
          GH_TOKEN: ${{ github.token }}
          CHATGPT_CI_BOOTSTRAP: ${{ secrets.CHATGPT_CI_BOOTSTRAP }}
          CHATGPT_CI_KEY: ${{ secrets.CHATGPT_CI_KEY }}
        run: python3 ci_session.py restore --directory "$CHATGPT_CI_SESSION_DIR"
      - name: GPT review or offline plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_ACCOUNT_A_TOKEN: ${{ secrets.REVIEW_ACCOUNT_A_TOKEN }}
          REVIEW_ACCOUNT_B_TOKEN: ${{ secrets.REVIEW_ACCOUNT_B_TOKEN }}
          LIVE_MODE: ${{ inputs.live }}
          REVIEW_AUTH: ${{ inputs.auth }}
        run: |
          if [ "$LIVE_MODE" = true ]; then
            python3 ai_review.py --config ai_review.config.json --db source_report/decrypted/recon_history.db --output ai_review_results.jsonl --auth "$REVIEW_AUTH" --live
          else
            python3 ai_review.py --config ai_review.config.json --db source_report/decrypted/recon_history.db --output ai_review_results.jsonl --auth "$REVIEW_AUTH"
          fi
      - name: Encrypt latest ChatGPT session
        if: always() && steps.restore_session.outcome == 'success'
        env:
          CHATGPT_CI_KEY: ${{ secrets.CHATGPT_CI_KEY }}
        run: python3 ci_session.py checkpoint --directory "$CHATGPT_CI_SESSION_DIR" --output "$RUNNER_TEMP/chatgpt-checkpoint/session.enc"
      - uses: actions/upload-artifact@v4
        if: always() && steps.restore_session.outcome == 'success'
        with:
          name: chatgpt-ci-session
          path: ${{ runner.temp }}/chatgpt-checkpoint/session.enc
          if-no-files-found: error
          retention-days: 30
      - name: Verify live Plus review completed
        if: inputs.live && inputs.auth == 'chatgpt'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports = [json.loads(line) for line in Path("ai_review_results.jsonl").read_text().splitlines()]
          if not reports or any(r["state"] in ("model_unavailable", "request_error") for r in reports):
              raise SystemExit("Plus review has no candidates or encountered a model/request error")
          print(f"Plus review processed {len(reports)} candidate(s)")
          PY
      - uses: actions/download-artifact@v4
        if: inputs.summary_run_id != '' && !inputs.live
        with:
          name: bounded-ai-review-secured
          run-id: ${{ inputs.summary_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior_review
      - name: Summarize prior review HTTP statuses
        if: inputs.summary_run_id != '' && !inputs.live
        env:
          REPORT_PASSWORD: ${{ secrets.ACTIONS_CRYPTO_PASSWORD }}
        run: |
          umask 077
          printf %s "$REPORT_PASSWORD" | gpg --decrypt --batch --yes --passphrase-fd 0 \
            --output "$RUNNER_TEMP/prior_review.jsonl" prior_review/ai_review_results.jsonl.gpg
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          rows = [json.loads(line) for line in
                  (Path(os.environ["RUNNER_TEMP"]) / "prior_review.jsonl").read_text().splitlines()]
          codes = collections.Counter(str(obs["status"]) for row in rows
                                      for obs in row["observations"])
          states = collections.Counter(row["state"] for row in rows)
          categories = collections.Counter(kind for row in rows for kind in row["categories"])
          findings = collections.Counter(finding["kind"] for row in rows
                                         for finding in row["findings"])
          from urllib.parse import urlsplit
          route_summaries = [{"path": urlsplit(row["url"]).path,
                              "categories": row["categories"],
                              "observations": [{"action": obs["action"], "status": obs["status"],
                                                "marker_reflected": obs["marker_reflected"]}
                                               for obs in row["observations"]],
                              "findings": [{"kind": finding["kind"], "status": finding["status"]}
                                           for finding in row["findings"]]}
                             for row in rows]
          print(json.dumps({"candidates": len(rows),
                            "http_status_counts": dict(sorted(codes.items())),
                            "review_states": dict(sorted(states.items())),
                            "categories": dict(sorted(categories.items())),
                            "finding_kinds": dict(sorted(findings.items())),
                            "routes": route_summaries}, sort_keys=True))
          PY
      - name: Encrypt observations before uploading
        if: always()
        env:
          REPORT_PASSWORD: ${{ secrets.ACTIONS_CRYPTO_PASSWORD }}
        run: |
          if [ -s ai_review_results.jsonl ]; then
            umask 077
            printf %s "$REPORT_PASSWORD" | gpg --symmetric --batch --yes --passphrase-fd 0 --cipher-algo AES256 --output ai_review_results.jsonl.gpg ai_review_results.jsonl
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-ai-review-secured
          path: ai_review_results.jsonl.gpg
          if-no-files-found: ignore
          retention-days: 7
