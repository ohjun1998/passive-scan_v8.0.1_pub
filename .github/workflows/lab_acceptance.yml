name: Synthetic web lab acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-web-lab-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify login, recovery, board, comments, and access checks
        run: python3 lab_acceptance.py
