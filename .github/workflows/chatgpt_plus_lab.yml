name: ChatGPT Plus local lab (manual)
on:
  workflow_dispatch:
    inputs:
      reset_session:
        description: 'Use newly uploaded bootstrap credentials after reconnecting ChatGPT'
        type: boolean
        default: false
      interactive_site:
        description: 'Run the login, recovery, board and comment lab'
        type: boolean
        default: false
      vulnerable_worker:
        description: 'Run the deliberately vulnerable note lab with real ChatGPT Plus (low reasoning)'
        type: boolean
        default: true
      force_refresh:
        description: 'Exercise live token renewal using the restored encrypted session'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/workflows/chatgpt_plus_lab.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: chatgpt-plus-session
  cancel-in-progress: false
jobs:
  lab:
    if: >-
      github.ref == 'refs/heads/main' && github.actor == 'ohjun1998' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.head_commit.message, 'Run Plus vulnerable lab once'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set runner session directory
        run: echo "CHATGPT_CI_SESSION_DIR=$RUNNER_TEMP/passive-scan-chatgpt" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openai cryptography
      - name: Restore protected ChatGPT session
        env:
          GH_TOKEN: ${{ github.token }}
          CHATGPT_CI_BOOTSTRAP: ${{ secrets.CHATGPT_CI_BOOTSTRAP }}
          CHATGPT_CI_KEY: ${{ secrets.CHATGPT_CI_KEY }}
          CHATGPT_CI_RESET: ${{ inputs.reset_session }}
        run: python ci_session.py restore --directory "$CHATGPT_CI_SESSION_DIR"
      - name: Verify live token renewal
        if: inputs.force_refresh
        run: |
          python - <<'PY'
          import os
          from chatgpt_auth import ChatGPTSession, _read_private, _write_private

          session = ChatGPTSession(os.environ["CHATGPT_CI_SESSION_DIR"])
          record = _read_private(session.session_file)
          if not record:
              raise RuntimeError("No restored session")
          previous_refresh_token = record["refresh_token"]
          record["expires_at"] = 0
          _write_private(session.session_file, record)
          session.access_token()
          renewed = _read_private(session.session_file)
          if renewed["refresh_token"] == previous_refresh_token:
              raise RuntimeError("Refresh token did not rotate")
          print("Live ChatGPT token renewal and rotation completed")
          PY
      - name: Exercise basic ChatGPT model check
        if: inputs.interactive_site
        run: python tests/lab_chatgpt_ci.py
      - name: Exercise interactive local web app
        if: inputs.interactive_site
        run: |
          python tests/lab_web_flow.py --output "$RUNNER_TEMP/web-lab-fixed.jsonl"
          python tests/lab_web_flow.py --chatgpt --output "$RUNNER_TEMP/web-lab-plus.jsonl"
      - name: Test vulnerable note with ChatGPT Plus
        if: inputs.vulnerable_worker || github.event_name == 'push'
        # This one-time push supplies explicit ownership of synthetic test data.
        run: python tests/lab_vulnerable_worker.py --auth chatgpt --reasoning-effort low --require-investigation --output "$RUNNER_TEMP/vulnerable-worker-plus.jsonl"
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.vulnerable_worker || github.event_name == 'push')
        with:
          name: vulnerable-worker-plus-results
          path: ${{ runner.temp }}/vulnerable-worker-plus.jsonl
          if-no-files-found: warn
          retention-days: 7
      - name: Encrypt latest session for the next run
        if: always()
        env:
          CHATGPT_CI_KEY: ${{ secrets.CHATGPT_CI_KEY }}
        run: python ci_session.py checkpoint --directory "$CHATGPT_CI_SESSION_DIR" --output "$RUNNER_TEMP/chatgpt-checkpoint/session.enc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatgpt-ci-session
          path: ${{ runner.temp }}/chatgpt-checkpoint/session.enc
          if-no-files-found: error
          retention-days: 30
