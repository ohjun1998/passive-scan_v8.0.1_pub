name: ChatGPT Plus local lab (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    if: github.ref == 'refs/heads/main' && github.actor == 'ohjun1998'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHATGPT_CI_ACCESS_TOKEN: ${{ secrets.CHATGPT_CI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openai cryptography
      - run: python tests/lab_chatgpt_ci.py
